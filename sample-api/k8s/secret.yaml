# Only needed when not using workload identity. Each key becomes a file under /etc/entra/ and is read
# through spring.config.import=configtree:/etc/entra/, so the file name is the property name.
apiVersion: v1
kind: Secret
metadata:
  name: sample-api-entra
type: Opaque
stringData:
  entra.security.credential.client-secret: "<client-secret-value>"
  # For a certificate instead, mount a PEM/PFX and set in the ConfigMap:
  #   credential.type: certificate
  #   credential.certificate-path: /etc/entra-cert/client.pem
