entra:
  security:
    tenant-id: 11111111-1111-1111-1111-111111111111
    client-id: 22222222-2222-2222-2222-222222222222
    clock-skew: 60s
    public-paths:
      - /public/**
    group-role-mappings:
      aaaaaaaa-0000-0000-0000-000000000001: [ORDERS_READ]
      "[Overage Group]": [ORDERS_READ]
    app-role-mappings:
      "[Orders.Sync]": [SYNC]
    client-role-mappings:
      44444444-4444-4444-4444-444444444444: [REPORTS]
    user:
      include-scopes: true
    graph:
      overage-enabled: true
    credential:
      type: client-secret
      client-secret: test-secret
    logging:
      log-claims: true

logging:
  level:
    io.github.rmkrdev.entra.security: DEBUG
