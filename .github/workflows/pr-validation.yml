name: PR validation

# Every pull request. Push to main is covered by CI. This workflow is the check to require
# in branch protection: the job named "PR validation" fails unless every job below succeeded.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile, test, coverage and dependency rules
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always() && matrix.java == '21'
        run: python3 .github/scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-surefire-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

  packaging:
    name: Sources, Javadoc and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package the release profile
        run: mvn -B -ntp -Prelease -DskipTests package

      - name: Require sources, Javadoc and SBOM jars
        run: |
          set -eu
          missing=0
          for module in entra-security-core entra-security-spring-boot-starter entra-security-test; do
            for suffix in sources.jar javadoc.jar; do
              if ! compgen -G "$module/target/*-$suffix" > /dev/null; then
                echo "missing $module $suffix"
                missing=1
              fi
            done
            if ! compgen -G "$module/target/bom.json" > /dev/null; then
              echo "missing $module SBOM"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: pr-sbom
          path: '**/target/bom.json'
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # GitHub dependency review needs the dependency graph, which is not enabled for this
      # repository. Compare release-profile SBOMs and query OSV for packages the pull request adds.
      - name: Review dependency changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cp .github/scripts/dependency-review.py /tmp/dependency-review.py
          collect_boms() {
            dest="$1"
            rm -rf "${dest}"
            mkdir -p "${dest}"
            find . -path '*/target/bom.json' -print0 > /tmp/bom-list
            while IFS= read -r -d '' bom; do
              rel="${bom#./}"
              mkdir -p "${dest}/$(dirname "${rel}")"
              cp "${bom}" "${dest}/${rel}"
            done < /tmp/bom-list
          }
          git checkout --detach "${BASE_SHA}"
          mvn -B -ntp -Prelease -DskipTests cyclonedx:makeBom -DoutputFormat=json -DoutputName=bom
          collect_boms /tmp/sbom-base
          git checkout --detach "${HEAD_SHA}"
          mvn -B -ntp -Prelease -DskipTests clean cyclonedx:makeBom -DoutputFormat=json -DoutputName=bom
          collect_boms /tmp/sbom-head
          python3 /tmp/dependency-review.py /tmp/sbom-base /tmp/sbom-head

  hygiene:
    name: Hygiene and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Repository hygiene
        run: python3 .github/scripts/pr-hygiene.py

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Lint GitHub Actions workflows
        run: ./actionlint -color

  result:
    name: PR validation
    if: always()
    needs: [verify, packaging, dependencies, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "packaging=${{ needs.packaging.result }}"
          echo "dependencies=${{ needs.dependencies.result }}"
          echo "hygiene=${{ needs.hygiene.result }}"

      - name: Fail unless every check succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
