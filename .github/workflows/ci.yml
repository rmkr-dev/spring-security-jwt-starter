name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: mvn verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always() && matrix.java == '21'
        run: python3 .github/scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  boot-compat:
    # Older Spring Boot 3.x lines consumers may still be on. The pinned version (spring-boot.version in the root
    # pom) is built on Java 17 and 21 by the job above. See docs/compatibility.md.
    name: Spring Boot compatibility (${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ['3.3.13', '3.4.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test against Spring Boot ${{ matrix.spring-boot }}
        run: mvn -B -ntp verify -Dspring-boot.version=${{ matrix.spring-boot }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-boot-${{ matrix.spring-boot }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  release-check:
    name: Release build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package with sources, Javadoc and SBOM
        run: mvn -B -ntp -Prelease -DskipTests package
